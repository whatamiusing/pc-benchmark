name: Build Windows benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and test the report
        shell: powershell
        run: .\Build.ps1 -ReportTest

      - name: Upload the unsigned executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waiu-pc-benchmark-windows-x64-unsigned
          path: build/WAIU-PC-Benchmark-*-x64.exe
          if-no-files-found: error
          retention-days: 7
